<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>AIR BUILDER — ساخت در هوا</title>
<style>
:root{--bg:#03050a;--g:#00ff9d;--c:#00e5ff;--y:#ffd60a;--m:#ff2d95;--panel:rgba(4,14,22,.92);--bd:rgba(0,255,157,.35);--tx:#e8fff8;--mu:#6a8a7c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Tahoma,'Segoe UI',system-ui,sans-serif}
#app{position:relative;width:100%;height:100%}
#cwrap{position:absolute;inset:0;z-index:1}
canvas#gl{display:block;width:100%;height:100%}
#cam{position:absolute;top:8px;left:8px;width:100px;height:75px;border-radius:10px;overflow:hidden;border:2px solid var(--g);opacity:0;z-index:20;box-shadow:0 0 16px rgba(0,255,157,.25)}
#cam.on{opacity:1}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#lm{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);z-index:25;pointer-events:none}
#top>*{pointer-events:auto}
.logo{font-size:13px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--g),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:6px;font-size:10px}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--bd)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
#hint{position:absolute;top:54px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--c);z-index:25;opacity:0;transition:.2s;text-align:center;max-width:92%}
#hint.show{opacity:1}
#cross{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:2px solid var(--g);border-radius:50%;pointer-events:none;z-index:15;opacity:0;box-shadow:0 0 12px rgba(0,255,157,.5);transition:opacity .15s}
#cross.on{opacity:1}
#cross::after{content:'';position:absolute;inset:8px;border:1px solid var(--c);border-radius:50%}
#panel{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 14px;background:linear-gradient(0deg,rgba(0,6,12,.96) 55%,transparent);z-index:30}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.btn{border:1px solid var(--bd);background:var(--panel);color:var(--tx);padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}
.btn.p{background:linear-gradient(135deg,rgba(0,255,157,.25),rgba(0,229,255,.12));border-color:var(--g);color:var(--g)}
.btn.d{border-color:#ff3b5c;color:#ff3b5c}
.btn:disabled{opacity:.4}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tool{flex:0 0 auto;min-width:72px;padding:10px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--panel);text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.tool span{display:block;font-size:22px;margin-bottom:4px}
.tool.on{border-color:var(--g);background:rgba(0,255,157,.15);color:var(--g);box-shadow:0 0 12px rgba(0,255,157,.2)}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center}
#ov.hid{display:none!important}
#ov h2{font-size:20px;margin-bottom:10px;background:linear-gradient(90deg,var(--g),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{max-width:300px;color:var(--mu);font-size:13px;line-height:1.6;margin-bottom:14px}
.spin{width:34px;height:34px;border:3px solid rgba(0,255,157,.2);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
#list{position:absolute;top:54px;right:8px;width:110px;max-height:40vh;overflow-y:auto;z-index:25;font-size:10px}
.item{padding:5px 8px;margin-bottom:4px;border-radius:8px;background:var(--panel);border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.item b{color:var(--g)}
.item button{border:none;background:transparent;color:#ff5a7a;font-size:12px;cursor:pointer;padding:0 4px}
#cnt{font-size:10px;color:var(--mu);margin-right:auto}
</style>
</head>
<body>
<div id="app">
<div id="cwrap"><canvas id="gl"></canvas></div>
<div id="cam"><video id="vid" playsinline muted autoplay></video><canvas id="lm"></canvas></div>
<div id="top">
<div class="logo">AIR BUILDER</div>
<div class="pills">
<div class="pill"><div class="dot" id="dcam"></div><span>دوربین</span></div>
<div class="pill"><div class="dot" id="dhand"></div><span>اشاره</span></div>
</div>
</div>
<div id="hint">فقط با انگشت اشاره کار می‌کند</div>
<div id="cross"></div>
<div id="list"></div>
<div id="panel">
<div class="row">
<button class="btn p" id="bstart">شروع دوربین</button>
<button class="btn d" id="bstop" disabled>توقف</button>
<button class="btn" id="bclear">پاک‌کردن همه</button>
<button class="btn" id="bfull">تمام‌صفحه</button>
<span id="cnt">۰ شیء</span>
</div>
<div class="tools" id="tools">
<div class="tool on" data-t="cube"><span>🧊</span>مکعب</div>
<div class="tool" data-t="sphere"><span>🔵</span>کره</div>
<div class="tool" data-t="pyramid"><span>🔺</span>هرم</div>
<div class="tool" data-t="ring"><span>⭕</span>حلقه</div>
<div class="tool" data-t="star"><span>⭐</span>ستاره</div>
<div class="tool" data-t="crystal"><span>💎</span>کریستال</div>
<div class="tool" data-t="tower"><span>🗼</span>برج</div>
<div class="tool" data-t="platform"><span>🟦</span>سکو</div>
</div>
</div>
<div id="ov">
<div class="spin" id="sp"></div>
<h2>AIR BUILDER</h2>
<p id="omsg">آماده‌سازی موتور سه‌بعدی و ردیابی انگشت اشاره...</p>
<button class="btn p" id="bperm" style="display:none">اجازه دوربین</button>
<button class="btn" id="bskip" style="display:none">ادامه بدون دوربین</button>
</div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="./air-engine.js"></script>
</body>
</html>
