<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>NEURO PARTICLES AI</title>
<style>
  :root {
    --bg: #000000;
    --neon-green: #00ff9d;
    --neon-cyan: #00f0ff;
    --neon-yellow: #ffe600;
    --panel: rgba(0, 12, 18, 0.88);
    --border: rgba(0, 255, 157, 0.4);
    --text: #e8fff5;
    --muted: #7a9a8c;
    --danger: #ff3b5c;
    --success: #00ff9d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', system-ui, sans-serif; }
  body.ltr { direction: ltr; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #canvas-container { position: absolute; inset: 0; z-index: 1; }
  canvas#three-canvas { display: block; width: 100%; height: 100%; }
  #camera-preview {
    position: absolute; top: 12px; right: 12px; width: 130px; height: 98px;
    border-radius: 12px; overflow: hidden; border: 2px solid var(--neon-green);
    background: #000; z-index: 40; opacity: 0; transition: opacity 0.35s;
    box-shadow: 0 0 20px rgba(0,255,157,0.35);
  }
  body.ltr #camera-preview { right: auto; left: 12px; }
  #camera-preview.active { opacity: 1; }
  #camera-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #landmark-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    z-index: 30; pointer-events: none;
  }
  #top-bar > * { pointer-events: auto; }
  .logo {
    font-size: 15px; font-weight: 700; letter-spacing: 1.2px;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo span { font-weight: 400; opacity: 0.75; font-size: 12px; }
  #status-cluster { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .status-pill {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 20px; background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--success); box-shadow: 0 0 10px var(--success); }
  .dot.off { background: var(--danger); }
  #control-panel {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 14px 20px;
    background: linear-gradient(0deg, rgba(0,8,12,0.95) 55%, transparent 100%);
    z-index: 30; display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 9px 15px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; backdrop-filter: blur(6px); white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    background: linear-gradient(135deg, rgba(0,255,157,0.3), rgba(0,240,255,0.18));
    border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 15px rgba(0,255,157,0.2);
  }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.active { background: rgba(0,255,157,0.22); border-color: var(--neon-green); color: var(--neon-green); }
  .btn:disabled { opacity: 0.45; pointer-events: none; }
  select, input[type="range"] {
    appearance: none; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 8px 11px; border-radius: 8px; font-size: 12px;
  }
  select { min-width: 115px; }
  input[type="range"] { width: 95px; height: 6px; padding: 0; accent-color: var(--neon-green); }
  .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #gesture-display {
    position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
    padding: 7px 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--neon-cyan); z-index: 25;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  #gesture-display.visible { opacity: 1; }
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.93);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 24px; text-align: center;
  }
  #overlay.hidden { display: none !important; }
  #overlay h2 {
    font-size: 24px; margin-bottom: 14px;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay p { max-width: 340px; line-height: 1.65; color: var(--muted); margin-bottom: 18px; font-size: 15px; }
  #overlay .btn { margin: 6px; min-width: 170px; padding: 13px 22px; font-size: 15px; }
  #stats {
    position: absolute; top: 60px; left: 12px; font-size: 11px; color: var(--muted);
    text-align: left; z-index: 25; line-height: 1.65; pointer-events: none;
  }
  body.ltr #stats { left: auto; right: 12px; text-align: right; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(0,255,157,0.2);
    border-top-color: var(--neon-green); border-radius: 50%;
    animation: spin 0.75s linear infinite; margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #permission-hint { font-size: 13px; color: var(--neon-yellow); margin-top: 8px; max-width: 300px; line-height: 1.5; }
  @media (max-width: 600px) {
    #camera-preview { width: 100px; height: 75px; }
    .logo { font-size: 13px; }
    .btn { padding: 8px 12px; font-size: 12px; }
    select { min-width: 95px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container"><canvas id="three-canvas"></canvas></div>
  <div id="camera-preview">
    <video id="webcam" playsinline muted autoplay></video>
    <canvas id="landmark-canvas"></canvas>
  </div>
  <div id="top-bar">
    <div class="logo">NEURO PARTICLES <span>AI</span></div>
    <div id="status-cluster">
      <div class="status-pill"><div class="dot" id="cam-dot"></div><span id="cam-label">دوربین</span></div>
      <div class="status-pill"><div class="dot" id="hand-dot"></div><span id="hand-label">دست</span></div>
    </div>
  </div>
  <div id="gesture-display">—</div>
  <div id="stats">
    <div>FPS: <span id="fps-val">—</span></div>
    <div>Particles: <span id="part-val">—</span></div>
    <div>Quality: <span id="qual-val">AUTO</span></div>
  </div>
  <div id="control-panel">
    <div class="row">
      <button class="btn primary" id="btn-start">شروع دوربین</button>
      <button class="btn danger" id="btn-stop" disabled>توقف</button>
      <button class="btn" id="btn-reset">بازنشانی</button>
      <button class="btn" id="btn-fullscreen">تمام‌صفحه</button>
      <button class="btn" id="btn-lang">English</button>
    </div>
    <div class="row">
      <span class="label">فرم</span>
      <select id="sel-formation">
        <option value="0">کره کهکشانی</option>
        <option value="1">گرداب</option>
        <option value="2">انفجار انرژی</option>
        <option value="3">کهکشان مارپیچ</option>
        <option value="4">موج ذرات</option>
        <option value="5">مارپیچ DNA</option>
        <option value="6">حلقه نئون</option>
        <option value="7">شبکه عصبی</option>
        <option value="8">کره انرژی</option>
        <option value="9">ابر آزاد</option>
      </select>
      <span class="label">کیفیت</span>
      <select id="sel-quality">
        <option value="auto">AUTO</option>
        <option value="low">LOW</option>
        <option value="medium">MEDIUM</option>
        <option value="high">HIGH</option>
        <option value="ultra">ULTRA</option>
      </select>
      <span class="label">رنگ</span>
      <select id="sel-color">
        <option value="neon">نئون</option>
        <option value="cyan">فیروزه‌ای</option>
        <option value="magenta">ارغوانی</option>
        <option value="gold">طلایی</option>
        <option value="rainbow">رنگین‌کمان</option>
      </select>
    </div>
    <div class="row">
      <span class="label">حساسیت</span>
      <input type="range" id="rng-sens" min="0.3" max="1.8" step="0.05" value="1.0" />
      <span class="label">اسکلت</span>
      <button class="btn" id="btn-skeleton">خاموش</button>
    </div>
  </div>
  <div id="overlay">
    <div class="spinner" id="load-spinner"></div>
    <h2 id="overlay-title">NEURO PARTICLES AI</h2>
    <p id="overlay-msg">در حال آماده‌سازی موتور گرافیکی و مدل هوش مصنوعی...</p>
    <div id="permission-hint" style="display:none">
      روی دکمه زیر بزنید. مرورگر از شما اجازه دسترسی به دوربین می‌خواهد.
    </div>
    <div style="margin-top:14px">
      <button class="btn primary" id="btn-overlay-start" style="display:none">اجازه دسترسی به دوربین</button>
      <button class="btn" id="btn-overlay-dismiss" style="display:none">ادامه بدون دوربین</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
const MAX_PARTICLES = { low: 4000, medium: 9000, high: 16000, ultra: 26000 };

const state = {
  cameraActive: false, handsDetected: 0, gesture: 'none', formation: 0,
  quality: 'auto', colorMode: 'neon', sensitivity: 1.0, showSkeleton: false,
  particleCount: IS_MOBILE ? 6500 : 12000, fps: 0, lang: 'fa',
  morphProgress: 1.0, energy: 0.5, expansion: 1.0, rotationY: 0, rotationX: 0,
  verticalOffset: 0, attraction: 0, shockwave: 0, colorHue: 0.35,
  lastHandCenter: null, lastHandTime: 0, prevTwoHandDist: 0, modelReady: false
};

const canvas = document.getElementById('three-canvas');
const video = document.getElementById('webcam');
const landmarkCanvas = document.getElementById('landmark-canvas');
const landmarkCtx = landmarkCanvas.getContext('2d');
const camPreview = document.getElementById('camera-preview');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const loadSpinner = document.getElementById('load-spinner');
const permissionHint = document.getElementById('permission-hint');
const btnOverlayStart = document.getElementById('btn-overlay-start');
const btnOverlayDismiss = document.getElementById('btn-overlay-dismiss');
const gestureDisplay = document.getElementById('gesture-display');
const camDot = document.getElementById('cam-dot');
const handDot = document.getElementById('hand-dot');
const camLabel = document.getElementById('cam-label');
const handLabel = document.getElementById('hand-label');
const fpsVal = document.getElementById('fps-val');
const partVal = document.getElementById('part-val');
const qualVal = document.getElementById('qual-val');

const i18n = {
  fa: {
    start: 'شروع دوربین', stop: 'توقف', reset: 'بازنشانی', fullscreen: 'تمام‌صفحه', lang: 'English',
    camera: 'دوربین', hands: 'دست', formation: 'فرم', quality: 'کیفیت', color: 'رنگ',
    sensitivity: 'حساسیت', skeleton: 'اسکلت', off: 'خاموش', on: 'روشن',
    loading: 'در حال آماده‌سازی موتور گرافیکی و مدل هوش مصنوعی...',
    ready: 'برای کنترل با دست، روی دکمه زیر بزنید تا مرورگر اجازه دوربین را بخواهد.',
    camDenied: 'دسترسی به دوربین رد شد.\nاز تنظیمات مرورگر اجازه دوربین را فعال کنید و صفحه را رفرش کنید.',
    camError: 'خطا در دسترسی به دوربین. مطمئن شوید دستگاه دوربین دارد و مجوز داده شده.',
    unsupported: 'این مرورگر از WebGL یا دوربین پشتیبانی کامل ندارد.',
    modelError: 'بارگذاری مدل ردیابی دست ناموفق بود. اتصال اینترنت را بررسی کنید.',
    tracking: 'ردیابی فعال', noHand: 'دستی نیست',
    permissionBtn: 'اجازه دسترسی به دوربین', dismissBtn: 'ادامه بدون دوربین',
    requesting: 'در حال درخواست...',
    gestureNames: {
      none: '—', open: 'کف دست باز', fist: 'مشت بسته', pinch: 'نیشگون',
      twoFinger: 'دو انگشت', moveL: 'چپ', moveR: 'راست', moveU: 'بالا',
      moveD: 'پایین', shock: 'موج شوک', expand: 'گسترش', compress: 'فشرده'
    }
  },
  en: {
    start: 'Start Camera', stop: 'Stop', reset: 'Reset', fullscreen: 'Fullscreen', lang: 'فارسی',
    camera: 'Camera', hands: 'Hands', formation: 'Formation', quality: 'Quality', color: 'Color',
    sensitivity: 'Sensitivity', skeleton: 'Skeleton', off: 'Off', on: 'On',
    loading: 'Initializing graphics & AI hand model...',
    ready: 'Tap the button below. The browser will ask for camera permission.',
    camDenied: 'Camera permission denied.\nEnable it in browser settings and refresh the page.',
    camError: 'Could not access camera. Check device and permissions.',
    unsupported: 'This browser does not fully support WebGL or camera.',
    modelError: 'Failed to load hand tracking model. Check network.',
    tracking: 'Tracking active', noHand: 'No hand',
    permissionBtn: 'Allow Camera Access', dismissBtn: 'Continue without camera',
    requesting: 'Requesting...',
    gestureNames: {
      none: '—', open: 'OPEN PALM', fist: 'CLOSED FIST', pinch: 'PINCH',
      twoFinger: 'TWO FINGER', moveL: 'LEFT', moveR: 'RIGHT', moveU: 'UP',
      moveD: 'DOWN', shock: 'SHOCKWAVE', expand: 'EXPAND', compress: 'COMPRESS'
    }
  }
};

function t(key) { return i18n[state.lang][key] || i18n.fa[key] || key; }

function updateUIText() {
  document.getElementById('btn-start').textContent = t('start');
  document.getElementById('btn-stop').textContent = t('stop');
  document.getElementById('btn-reset').textContent = t('reset');
  document.getElementById('btn-fullscreen').textContent = t('fullscreen');
  document.getElementById('btn-lang').textContent = t('lang');
  camLabel.textContent = t('camera');
  handLabel.textContent = t('hands');
  const labels = document.querySelectorAll('.label');
  if (labels[0]) labels[0].textContent = t('formation');
  if (labels[1]) labels[1].textContent = t('quality');
  if (labels[2]) labels[2].textContent = t('color');
  if (labels[3]) labels[3].textContent = t('sensitivity');
  if (labels[4]) labels[4].textContent = t('skeleton');
  document.getElementById('btn-skeleton').textContent = state.showSkeleton ? t('on') : t('off');
  btnOverlayStart.textContent = t('permissionBtn');
  btnOverlayDismiss.textContent = t('dismissBtn');
  document.body.classList.toggle('ltr', state.lang === 'en');
  document.documentElement.dir = state.lang === 'en' ? 'ltr' : 'rtl';
  document.documentElement.lang = state.lang;
}

let renderer, scene, camera, composer, bloomPass;
let particleSystem, positions, colors, targetPositions;
let particleGeo, particleMat;
let clock = new THREE.Clock();
let frameCount = 0, lastFpsTime = performance.now(), autoQualityTimer = 0;

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 28);
  const starGeo = new THREE.BufferGeometry();
  const starCount = IS_MOBILE ? 350 : 800;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random()-0.5)*180;
    starPos[i*3+1] = (Math.random()-0.5)*180;
    starPos[i*3+2] = (Math.random()-0.5)*180 - 40;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88aacc, size: 0.08, transparent: true, opacity: 0.5, depthWrite: false })));
  createParticles(state.particleCount);
  const renderPass = new RenderPass(scene, camera);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.4, 0.2);
  composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);
  window.addEventListener('resize', onResize);
}

function createParticles(count) {
  if (particleSystem) { scene.remove(particleSystem); particleGeo.dispose(); particleMat.dispose(); }
  state.particleCount = count;
  positions = new Float32Array(count * 3);
  colors = new Float32Array(count * 3);
  targetPositions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const r = 8 + Math.random() * 6;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i3+2] = r * Math.cos(phi);
    targetPositions[i3] = positions[i3];
    targetPositions[i3+1] = positions[i3+1];
    targetPositions[i3+2] = positions[i3+2];
    setParticleColor(i, 0.3 + Math.random() * 0.4);
  }
  particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  particleMat = new THREE.PointsMaterial({
    size: IS_MOBILE ? 0.15 : 0.11, vertexColors: true, transparent: true, opacity: 0.92,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  particleSystem = new THREE.Points(particleGeo, particleMat);
  scene.add(particleSystem);
  generateFormation(state.formation);
  partVal.textContent = count.toLocaleString();
}

function setParticleColor(i, tVal) {
  const i3 = i * 3;
  let h, s = 0.92, l = 0.55;
  switch (state.colorMode) {
    case 'cyan': h = 0.48 + tVal * 0.08; break;
    case 'magenta': h = 0.85 + tVal * 0.08; break;
    case 'gold': h = 0.12 + tVal * 0.06; break;
    case 'rainbow': h = (tVal + state.colorHue) % 1; break;
    default: h = 0.32 + tVal * 0.18;
  }
  const c = new THREE.Color().setHSL(h, s, l);
  colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b;
}

function generateFormation(id) {
  const n = state.particleCount;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    let x = 0, y = 0, z = 0;
    const tt = i / n;
    switch (id) {
      case 0: {
        const r = 6 + Math.random() * 5;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        x = r * Math.sin(ph) * Math.cos(th);
        y = r * Math.sin(ph) * Math.sin(th) * 0.85;
        z = r * Math.cos(ph);
        break;
      }
      case 1: {
        const angle = tt * Math.PI * 12;
        const radius = 2 + tt * 9;
        x = Math.cos(angle) * radius; y = (tt - 0.5) * 16; z = Math.sin(angle) * radius;
        break;
      }
      case 2: {
        const r = 3 + Math.pow(Math.random(), 0.55) * 12;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        x = r * Math.sin(ph) * Math.cos(th); y = r * Math.sin(ph) * Math.sin(th); z = r * Math.cos(ph);
        break;
      }
      case 3: {
        const arm = i % 3;
        const angle = tt * Math.PI * 8 + arm * (Math.PI * 2 / 3);
        const radius = 1.5 + tt * 11;
        x = Math.cos(angle) * radius; y = (Math.random() - 0.5) * 1.8; z = Math.sin(angle) * radius;
        break;
      }
      case 4: {
        const cols = Math.ceil(Math.sqrt(n));
        const row = Math.floor(i / cols); const col = i % cols;
        x = (col / cols - 0.5) * 22; z = (row / cols - 0.5) * 22;
        y = Math.sin(x * 0.4 + z * 0.3) * 3.5;
        break;
      }
      case 5: {
        const strand = i % 2;
        const angle = tt * Math.PI * 10;
        x = Math.cos(angle + strand * Math.PI) * 3.2;
        y = (tt - 0.5) * 18;
        z = Math.sin(angle + strand * Math.PI) * 3.2;
        if (i % 7 === 0) { x *= 0.3; z *= 0.3; }
        break;
      }
      case 6: {
        const angle = tt * Math.PI * 2;
        const radius = 8 + Math.sin(tt * Math.PI * 6) * 1.5;
        x = Math.cos(angle) * radius; y = Math.sin(tt * Math.PI * 4) * 1.5; z = Math.sin(angle) * radius;
        break;
      }
      case 7: {
        const cluster = Math.floor(Math.random() * 8);
        const cx = Math.cos(cluster / 8 * Math.PI * 2) * 8;
        const cy = Math.sin(cluster / 8 * Math.PI * 2) * 5;
        const cz = (cluster % 3 - 1) * 4;
        if (Math.random() < 0.7) {
          x = cx + (Math.random()-0.5)*3.5; y = cy + (Math.random()-0.5)*3.5; z = cz + (Math.random()-0.5)*3.5;
        } else {
          const c2 = (cluster + 1) % 8;
          const tl = Math.random();
          x = cx + (Math.cos(c2/8*Math.PI*2)*8 - cx) * tl;
          y = cy + (Math.sin(c2/8*Math.PI*2)*5 - cy) * tl;
          z = cz + ((c2%3-1)*4 - cz) * tl;
        }
        break;
      }
      case 8: {
        const r = 9 + Math.random() * 2.2;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        x = r * Math.sin(ph) * Math.cos(th); y = r * Math.sin(ph) * Math.sin(th); z = r * Math.cos(ph);
        break;
      }
      default: {
        x = (Math.random()-0.5)*18; y = (Math.random()-0.5)*14; z = (Math.random()-0.5)*18;
      }
    }
    targetPositions[i3] = x; targetPositions[i3+1] = y; targetPositions[i3+2] = z;
  }
  state.morphProgress = 0;
}

function updateParticles(dt) {
  const n = state.particleCount;
  const expand = state.expansion, energy = state.energy, attr = state.attraction, shock = state.shockwave;
  const cosY = Math.cos(state.rotationY), sinY = Math.sin(state.rotationY);
  const cosX = Math.cos(state.rotationX), sinX = Math.sin(state.rotationX);
  if (state.morphProgress < 1) state.morphProgress = Math.min(1, state.morphProgress + dt * 0.55);
  const morph = state.morphProgress, time = clock.elapsedTime;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    let tx = targetPositions[i3] * expand;
    let ty = targetPositions[i3+1] * expand + state.verticalOffset;
    let tz = targetPositions[i3+2] * expand;
    let rx = tx * cosY - tz * sinY;
    let rz = tx * sinY + tz * cosY;
    let ry = ty * cosX - rz * sinX;
    rz = ty * sinX + rz * cosX;
    tx = rx; ty = ry; tz = rz;
    if (attr > 0.01) { const f = 1 - attr * 0.7; tx *= f; ty *= f; tz *= f; }
    if (shock > 0.01) {
      const len = Math.sqrt(tx*tx + ty*ty + tz*tz) + 0.001;
      const push = shock * 4.5 / (1 + len * 0.08);
      tx += (tx/len)*push; ty += (ty/len)*push; tz += (tz/len)*push;
    }
    tx += Math.sin(i*0.17 + time*1.3) * energy * 0.14;
    ty += Math.cos(i*0.13 + time*1.1) * energy * 0.1;
    tz += Math.sin(i*0.21 + time*0.9) * energy * 0.12;
    const lerp = 0.06 + morph * 0.12;
    positions[i3]   += (tx - positions[i3]) * lerp;
    positions[i3+1] += (ty - positions[i3+1]) * lerp;
    positions[i3+2] += (tz - positions[i3+2]) * lerp;
    if (i % 19 === 0 || state.colorMode === 'rainbow') setParticleColor(i, 0.3 + 0.4 * Math.sin(time*2 + i*0.01));
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
  state.shockwave *= 0.92;
  state.attraction *= 0.96;
  if (state.energy > 0.5) state.energy += (0.5 - state.energy) * 0.02;
  if (state.expansion !== 1) state.expansion += (1 - state.expansion) * 0.018;
}

let handLandmarker = null;
let lastVideoTime = -1;

async function initMediaPipe() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
    const { HandLandmarker, FilesetResolver } = vision;
    const filesetResolver = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
    });
    state.modelReady = true;
    return true;
  } catch (err) {
    console.error('MediaPipe failed:', err);
    state.modelReady = false;
    return false;
  }
}

async function requestCameraPermission() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError(t('unsupported'));
    return false;
  }
  try {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(tr => tr.stop());
      video.srcObject = null;
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'user' },
        width:  { ideal: 640, max: 1280 },
        height: { ideal: 480, max: 720 }
      }
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', 'true');
    video.muted = true;
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('timeout')), 8000);
      video.onloadedmetadata = () => {
        clearTimeout(timeout);
        video.play().then(resolve).catch(reject);
      };
      video.onerror = () => { clearTimeout(timeout); reject(new Error('video error')); };
    });
    landmarkCanvas.width  = video.videoWidth  || 640;
    landmarkCanvas.height = video.videoHeight || 480;
    state.cameraActive = true;
    camPreview.classList.add('active');
    camDot.className = 'dot on';
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    overlay.classList.add('hidden');
    if (state.modelReady && handLandmarker) detectLoop();
    return true;
  } catch (err) {
    console.error('Camera error:', err);
    let msg = t('camError');
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') msg = t('camDenied');
    else if (err.name === 'NotFoundError') msg = state.lang === 'fa' ? 'دوربینی پیدا نشد.' : 'No camera found.';
    else if (err.name === 'NotReadableError') msg = state.lang === 'fa' ? 'دوربین در حال استفاده توسط برنامه دیگری است.' : 'Camera is in use by another app.';
    showError(msg, true);
    camDot.className = 'dot off';
    state.cameraActive = false;
    return false;
  }
}

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(tr => tr.stop());
    video.srcObject = null;
  }
  state.cameraActive = false;
  state.handsDetected = 0;
  camPreview.classList.remove('active');
  camDot.className = 'dot';
  handDot.className = 'dot';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  landmarkCtx.clearRect(0, 0, landmarkCanvas.width, landmarkCanvas.height);
  gestureDisplay.classList.remove('visible');
}

function detectLoop() {
  if (!state.cameraActive || !handLandmarker) return;
  const now = performance.now();
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try {
      const results = handLandmarker.detectForVideo(video, now);
      processHands(results);
    } catch (e) {}
  }
  requestAnimationFrame(detectLoop);
}

function processHands(results) {
  const hands = results.landmarks || [];
  state.handsDetected = hands.length;
  if (hands.length === 0) {
    handDot.className = 'dot';
    handLabel.textContent = t('noHand');
    if (state.gesture !== 'none') { state.gesture = 'none'; updateGestureUI(); }
    landmarkCtx.clearRect(0, 0, landmarkCanvas.width, landmarkCanvas.height);
    return;
  }
  handDot.className = 'dot on';
  handLabel.textContent = t('tracking');
  if (state.showSkeleton) drawLandmarks(hands);
  else landmarkCtx.clearRect(0, 0, landmarkCanvas.width, landmarkCanvas.height);
  const sens = state.sensitivity;
  const landmarks = hands[0];
  const wrist = landmarks[0], thumbTip = landmarks[4], indexTip = landmarks[8];
  const middleTip = landmarks[12], pinkyTip = landmarks[20];
  const indexPip = landmarks[6], middlePip = landmarks[10];
  const pinchDist = distance3(thumbTip, indexTip);
  const openScore = (distance3(indexTip, wrist) + distance3(middleTip, wrist) + distance3(pinkyTip, wrist)) / 3;
  const fistScore = (distance3(indexTip, indexPip) + distance3(middleTip, middlePip)) / 2;
  const cx = (wrist.x + indexTip.x + pinkyTip.x) / 3;
  const cy = (wrist.y + indexTip.y + pinkyTip.y) / 3;
  const now = performance.now();
  let vel = 0;
  if (state.lastHandCenter) {
    const dx = cx - state.lastHandCenter.x, dy = cy - state.lastHandCenter.y;
    const dt = Math.max(0.016, (now - state.lastHandTime) / 1000);
    vel = Math.sqrt(dx*dx + dy*dy) / dt;
  }
  state.lastHandCenter = { x: cx, y: cy };
  state.lastHandTime = now;
  let twoHandGesture = null;
  if (hands.length >= 2) {
    const h2 = hands[1];
    const c2x = (h2[0].x + h2[8].x + h2[20].x) / 3;
    const c2y = (h2[0].y + h2[8].y + h2[20].y) / 3;
    const dist = Math.sqrt((cx-c2x)**2 + (cy-c2y)**2);
    if (state.prevTwoHandDist > 0) {
      const delta = dist - state.prevTwoHandDist;
      if (delta > 0.045 * sens) twoHandGesture = 'expand';
      else if (delta < -0.045 * sens) twoHandGesture = 'compress';
    }
    state.prevTwoHandDist = dist;
  } else state.prevTwoHandDist = 0;
  let gesture = 'none';
  if (twoHandGesture) gesture = twoHandGesture;
  else if (vel > 1.9 * sens) gesture = 'shock';
  else if (pinchDist < 0.055 * (2 - sens * 0.4)) gesture = 'pinch';
  else if (openScore > 0.27 * sens && fistScore > 0.11) gesture = 'open';
  else if (openScore < 0.17 / sens && fistScore < 0.075) gesture = 'fist';
  else if (Math.abs(cx - 0.5) > 0.17 * sens) gesture = cx < 0.5 ? 'moveL' : 'moveR';
  else if (Math.abs(cy - 0.5) > 0.15 * sens) gesture = cy < 0.45 ? 'moveU' : 'moveD';
  else if (distance3(indexTip, middleTip) < 0.065 && distance3(indexTip, wrist) > 0.2) gesture = 'twoFinger';
  if (gesture !== state.gesture) {
    state.gesture = gesture;
    applyGesture(gesture);
    updateGestureUI();
  } else applyContinuous(gesture, { cx, cy, pinchDist });
}

function distance3(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z||0) - (b.z||0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

function applyGesture(g) {
  switch (g) {
    case 'open': state.expansion = Math.min(2.3, state.expansion + 0.4); state.energy = Math.min(1.4, state.energy + 0.3); break;
    case 'fist': state.expansion = Math.max(0.22, state.expansion - 0.45); state.energy = Math.max(0.2, state.energy - 0.15); break;
    case 'pinch': state.attraction = Math.min(1, state.attraction + 0.5); break;
    case 'shock': state.shockwave = 1.0; state.energy = 1.35; break;
    case 'expand': state.expansion = Math.min(2.7, state.expansion + 0.55); break;
    case 'compress': state.expansion = Math.max(0.18, state.expansion - 0.55); break;
    case 'moveL': state.rotationY -= 0.28; break;
    case 'moveR': state.rotationY += 0.28; break;
    case 'moveU': state.verticalOffset = Math.min(6.5, state.verticalOffset + 1.3); break;
    case 'moveD': state.verticalOffset = Math.max(-6.5, state.verticalOffset - 1.3); break;
    case 'twoFinger': state.rotationY += 0.09; break;
  }
}

function applyContinuous(g, data) {
  if (g === 'pinch') state.attraction = Math.min(1, 0.25 + (0.08 - data.pinchDist) * 9);
  if (g === 'twoFinger') { state.rotationY += (data.cx - 0.5) * 0.045; state.rotationX += (data.cy - 0.5) * 0.03; }
  if (g === 'moveL' || g === 'moveR') state.rotationY += (data.cx - 0.5) * 0.07;
  if (g === 'moveU' || g === 'moveD') {
    state.verticalOffset += (0.5 - data.cy) * 0.16;
    state.verticalOffset = Math.max(-7, Math.min(7, state.verticalOffset));
  }
}

function updateGestureUI() {
  const name = i18n[state.lang].gestureNames[state.gesture] || state.gesture;
  gestureDisplay.textContent = name;
  gestureDisplay.classList.toggle('visible', state.gesture !== 'none');
}

function drawLandmarks(hands) {
  const w = landmarkCanvas.width, h = landmarkCanvas.height;
  landmarkCtx.clearRect(0, 0, w, h);
  landmarkCtx.save();
  landmarkCtx.scale(-1, 1);
  landmarkCtx.translate(-w, 0);
  const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  for (const hand of hands) {
    landmarkCtx.strokeStyle = 'rgba(0,255,157,0.75)';
    landmarkCtx.lineWidth = 2.5;
    for (const [a,b] of connections) {
      landmarkCtx.beginPath();
      landmarkCtx.moveTo(hand[a].x * w, hand[a].y * h);
      landmarkCtx.lineTo(hand[b].x * w, hand[b].y * h);
      landmarkCtx.stroke();
    }
    landmarkCtx.fillStyle = 'rgba(0,240,255,0.95)';
    for (const p of hand) {
      landmarkCtx.beginPath();
      landmarkCtx.arc(p.x * w, p.y * h, 3.5, 0, Math.PI * 2);
      landmarkCtx.fill();
    }
  }
  landmarkCtx.restore();
}

function setQuality(q) {
  state.quality = q;
  qualVal.textContent = q.toUpperCase();
  let count, bloomStr = 0.7, pr = Math.min(window.devicePixelRatio, 2);
  if (q === 'auto') { count = IS_MOBILE ? 7000 : 12000; bloomStr = 0.75; }
  else if (q === 'low') { count = MAX_PARTICLES.low; bloomStr = 0.35; pr = 1; }
  else if (q === 'medium') { count = MAX_PARTICLES.medium; bloomStr = 0.6; pr = Math.min(window.devicePixelRatio, 1.5); }
  else if (q === 'high') { count = MAX_PARTICLES.high; bloomStr = 0.85; }
  else { count = MAX_PARTICLES.ultra; bloomStr = 1.05; }
  renderer.setPixelRatio(pr);
  bloomPass.strength = bloomStr;
  if (Math.abs(count - state.particleCount) > 400) createParticles(count);
}

function autoAdjustQuality(fps) {
  if (state.quality !== 'auto') return;
  autoQualityTimer++;
  if (autoQualityTimer < 40) return;
  autoQualityTimer = 0;
  if (fps < 27 && state.particleCount > 4200) {
    createParticles(Math.max(4000, Math.floor(state.particleCount * 0.78)));
    bloomPass.strength = Math.max(0.3, bloomPass.strength - 0.08);
  } else if (fps > 50 && state.particleCount < (IS_MOBILE ? 11000 : 20000)) {
    createParticles(Math.min(IS_MOBILE ? 12000 : 22000, Math.floor(state.particleCount * 1.15)));
    bloomPass.strength = Math.min(0.95, bloomPass.strength + 0.05);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  updateParticles(dt);
  if (state.handsDetected === 0) state.rotationY += dt * 0.07;
  if (state.colorMode === 'rainbow') state.colorHue = (state.colorHue + dt * 0.04) % 1;
  composer.render();
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    state.fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
    fpsVal.textContent = state.fps;
    frameCount = 0; lastFpsTime = now;
    autoAdjustQuality(state.fps);
  }
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); bloomPass.resolution.set(w, h);
}

function showError(msg, showDismiss = false) {
  loadSpinner.style.display = 'none';
  permissionHint.style.display = 'none';
  overlayTitle.textContent = 'NEURO PARTICLES AI';
  overlayMsg.textContent = msg;
  overlay.classList.remove('hidden');
  btnOverlayStart.style.display = 'inline-block';
  btnOverlayDismiss.style.display = showDismiss ? 'inline-block' : 'none';
  btnOverlayStart.disabled = false;
  btnOverlayStart.textContent = t('permissionBtn');
}

function showReady() {
  loadSpinner.style.display = 'none';
  overlayTitle.textContent = 'NEURO PARTICLES AI';
  overlayMsg.textContent = t('ready');
  permissionHint.style.display = 'block';
  overlay.classList.remove('hidden');
  btnOverlayStart.style.display = 'inline-block';
  btnOverlayDismiss.style.display = 'inline-block';
  btnOverlayStart.disabled = false;
  btnOverlayStart.textContent = t('permissionBtn');
}

document.getElementById('btn-start').addEventListener('click', () => requestCameraPermission());
document.getElementById('btn-stop').addEventListener('click', stopCamera);
document.getElementById('btn-reset').addEventListener('click', () => {
  state.expansion = 1; state.energy = 0.5; state.attraction = 0; state.shockwave = 0;
  state.rotationY = 0; state.rotationX = 0; state.verticalOffset = 0;
  generateFormation(state.formation);
});
document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
document.getElementById('btn-lang').addEventListener('click', () => {
  state.lang = state.lang === 'fa' ? 'en' : 'fa';
  updateUIText(); updateGestureUI();
  if (!overlay.classList.contains('hidden')) {
    overlayMsg.textContent = state.modelReady ? t('ready') : t('loading');
    btnOverlayStart.textContent = t('permissionBtn');
    btnOverlayDismiss.textContent = t('dismissBtn');
  }
});
document.getElementById('sel-formation').addEventListener('change', e => {
  state.formation = parseInt(e.target.value, 10);
  generateFormation(state.formation);
});
document.getElementById('sel-quality').addEventListener('change', e => setQuality(e.target.value));
document.getElementById('sel-color').addEventListener('change', e => {
  state.colorMode = e.target.value;
  for (let i = 0; i < state.particleCount; i++) setParticleColor(i, Math.random());
  particleGeo.attributes.color.needsUpdate = true;
});
document.getElementById('rng-sens').addEventListener('input', e => { state.sensitivity = parseFloat(e.target.value); });
document.getElementById('btn-skeleton').addEventListener('click', () => {
  state.showSkeleton = !state.showSkeleton;
  document.getElementById('btn-skeleton').textContent = state.showSkeleton ? t('on') : t('off');
  document.getElementById('btn-skeleton').classList.toggle('active', state.showSkeleton);
});

btnOverlayStart.addEventListener('click', async () => {
  btnOverlayStart.disabled = true;
  btnOverlayStart.textContent = t('requesting');
  const ok = await requestCameraPermission();
  if (!ok) {
    btnOverlayStart.disabled = false;
    btnOverlayStart.textContent = t('permissionBtn');
  }
});

btnOverlayDismiss.addEventListener('click', () => overlay.classList.add('hidden'));

async function boot() {
  updateUIText();
  if (!window.WebGLRenderingContext) { showError(t('unsupported')); return; }
  try { initThree(); } catch (e) { console.error(e); showError(t('unsupported')); return; }
  overlayMsg.textContent = t('loading');
  loadSpinner.style.display = 'block';
  const ok = await initMediaPipe();
  if (!ok) showError(t('modelError'), true);
  else showReady();
  setQuality('auto');
  animate();
}

boot();
</script>
</body>
</html>
